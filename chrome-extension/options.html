<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>JD Flow options</title>
    <style>
      body {
        font: 14px/1.4 system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      button {
        margin-top: 8px;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <h1>JD Flow webhook</h1>
    <p>Ingest (Send job): <code>http://localhost:5678/webhook/job-ingest</code></p>
    <p>Resume (Continue Phase 2): derived as <code>…/job-resume</code> from the URL below.</p>
    <p>Editor test: <code>http://localhost:5678/webhook-test/job-ingest</code></p>
    <label>
      URL
      <input id="webhookUrl" type="url" />
    </label>
    <button id="save" type="button">Save</button>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
